<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERA — Dhvani Patel</title>
<style>
  html, body{ margin: 0; height: 100%; background: #0c1526; }
  iframe{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .pill-btn{
    position: fixed;
    z-index: 1000;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 22px;
    border-radius: 100px;
    background: rgba(59, 0, 0, 0.6);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(240, 238, 231, 0.15);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    color: #F0EEE7;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.2px;
    text-decoration: none;
    transition: transform 0.25s ease, opacity 0.25s ease, background 0.25s ease;
  }
  .pill-btn:hover{ transform: translateY(-2px); background: rgba(59, 0, 0, 0.8); }
  .back-btn{ top: 64px; right: 20px; }
  .next-btn{
    bottom: 28px;
    right: 28px;
    padding: 16px 26px;
    font-size: 15px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(14px);
  }
  .next-btn.is-visible{
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
</style>
</head>
<body>

<a class="pill-btn back-btn" href="projects.html">← Back to Projects</a>
<a class="pill-btn next-btn" id="nextProjectBtn" href="beadcraft-case-study.html">Next Project: BeadCraft →</a>

<!-- The case study itself is loaded exactly as supplied, unmodified, via
     iframe — this wrapper only adds the back button and the "next
     project" reveal on top of it, it never touches the file's content. -->
<iframe id="seraFrame" src="sera-case-study%20final.html" title="SERA — Case Study by Dhvani Patel"></iframe>

<script>
(function(){
  var frame = document.getElementById('seraFrame');
  var nextBtn = document.getElementById('nextProjectBtn');

  frame.addEventListener('load', function(){
    try{
      var win = frame.contentWindow;
      var doc = frame.contentDocument;

      function checkScroll(){
        var scrollEl = doc.scrollingElement || doc.documentElement;
        var nearBottom = (win.innerHeight + win.scrollY) >= (scrollEl.scrollHeight - 120);
        nextBtn.classList.toggle('is-visible', nearBottom);
      }

      win.addEventListener('scroll', checkScroll, { passive: true });
      win.addEventListener('resize', checkScroll);
      checkScroll();
    }catch(e){
      // Cross-origin or otherwise inaccessible — leave the next-project
      // button reachable but not auto-revealed.
    }
  });
})();
</script>

</body>
</html>
